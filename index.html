<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PlayStation Physical Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14182C;
    --surface: #1B2040;
    --surface-2: #242A52;
    --text: #EDEFF7;
    --muted: #9199C4;
    --accent: #E4A94A;
    --accent-dim: rgba(228,169,74,0.16);
    --owned: #6FBF8B;
    --owned-dim: rgba(111,191,139,0.14);
    --wishlist: #D8798F;
    --wishlist-dim: rgba(216,121,143,0.14);
    --border: rgba(237,239,247,0.09);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 20px 100px;
    min-height: 100vh;
  }
  header.masthead {
    margin-bottom: 22px;
  }
  header.masthead h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  header.masthead p {
    color: var(--muted);
    margin: 0;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .counts {
    display: flex;
    gap: 18px;
    margin-top: 16px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .counts b { color: var(--text); font-weight: 600; }
  .toolbar {
    display: flex;
    gap: 8px;
    margin: 22px 0 14px;
  }
  .search {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 13px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { outline: none; border-color: var(--accent); }
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 18px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px 6px;
    border-radius: 8px;
    font-size: 13.5px;
    color: var(--muted);
    cursor: pointer;
    font-weight: 500;
    transition: background .15s, color .15s;
  }
  .tab.active { background: var(--surface-2); color: var(--text); }
  .tab .n { color: var(--muted); margin-left: 4px; }
 
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.owned { background: var(--owned); }
  .status-dot.wishlist { background: var(--wishlist); }
  .row-main { flex: 1; min-width: 0; }
  .row-title {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    line-height: 1.3;
    margin: 0 0 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-meta {
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--surface-2);
    color: var(--muted);
  }
  .chev { color: var(--muted); font-size: 18px; flex-shrink: 0; }
 
  .empty {
    padding: 60px 10px;
    text-align: center;
    color: var(--muted);
  }
  .empty p { font-size: 15px; margin: 0; line-height: 1.6; }
 
  .fab {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 520px;
    background: var(--accent);
    color: #1B1503;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 15.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
 
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,12,24,0.6);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .sheet {
    background: var(--surface);
    width: 100%;
    max-width: 560px;
    border-radius: 18px 18px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height: 88vh;
    overflow-y: auto;
  }
  .sheet h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 21px;
    margin: 0 0 18px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 12px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
 
  .segmented {
    display: flex;
    gap: 8px;
  }
  .segmented button {
    flex: 1;
    padding: 10px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .segmented button.sel-owned.active { background: var(--owned-dim); color: var(--owned); border-color: var(--owned); }
  .segmented button.sel-wishlist.active { background: var(--wishlist-dim); color: var(--wishlist); border-color: var(--wishlist); }
 
  .sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: #1B1503;
    border: none;
    border-radius: 9px;
    padding: 13px;
    font-weight: 600;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 13px 16px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-delete {
    color: var(--wishlist);
    background: transparent;
    border: none;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    padding: 6px 0;
    margin-top: 4px;
  }
  .loading { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Opening the shelf…</div>
</div>
 
<script>
const STORAGE_KEY = 'ps-shelf:games';
let games = [];
let filter = 'all';
let query = '';
let editingId = null;
let loaded = false;
let sheetOpenFlag = false;
let formStatus = 'owned';
 
const PLATFORMS = ['PS5','PS4','PS3','PS2','PS1','PS Vita'];
const app = document.getElementById('app');
 
async function loadGames() {
  try {
    const result = await window.storage.get(STORAGE_KEY, false);
    games = result ? JSON.parse(result.value) : [];
  } catch (e) {
    games = [];
  }
  loaded = true;
  render();
}
 
async function saveGames() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(games), false);
  } catch (e) {
    console.error('Could not save', e);
  }
}
 
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
 
function openSheet(id) {
  sheetOpenFlag = true;
  editingId = id || null;
  const existing = editingId ? games.find(g => g.id === editingId) : null;
  formStatus = existing ? existing.status : 'owned';
  render();
}
function closeSheet() {
  sheetOpenFlag = false;
  editingId = null;
  render();
}
 
function submitForm(form) {
  const title = form.title.value.trim();
  if (!title) return;
  const platform = form.platform.value;
  const notes = form.notes.value.trim();
 
  if (editingId) {
    const g = games.find(x => x.id === editingId);
    Object.assign(g, { title, platform, status: formStatus, notes });
  } else {
    games.push({ id: uid(), title, platform, status: formStatus, notes, added: Date.now() });
  }
  saveGames();
  closeSheet();
}
 
function deleteGame(id) {
  games = games.filter(g => g.id !== id);
  saveGames();
  closeSheet();
}
 
function render() {
  cleanupSheet();
  if (!loaded) { app.innerHTML = '<div class="loading">Opening the shelf…</div>'; return; }
 
  const activeSearch = document.activeElement && document.activeElement.classList.contains('search');
  const caret = activeSearch ? document.activeElement.selectionStart : null;
 
  const ownedCount = games.filter(g => g.status === 'owned').length;
  const wishCount = games.filter(g => g.status === 'wishlist').length;
 
  let visible = games.filter(g => {
    if (filter !== 'all' && g.status !== filter) return false;
    if (query && !g.title.toLowerCase().includes(query.toLowerCase())) return false;
    return true;
  }).sort((a,b) => a.title.localeCompare(b.title));
 
  const rowsHtml = visible.length ? visible.map(g => `
    <div class="row" data-action="open-sheet" data-id="${g.id}">
      <span class="status-dot ${g.status}"></span>
      <div class="row-main">
        <p class="row-title">${escapeHtml(g.title)}</p>
        <div class="row-meta">
          <span class="badge">${g.platform}</span>
          ${g.notes ? `<span>${escapeHtml(g.notes.slice(0,40))}${g.notes.length>40?'…':''}</span>` : ''}
        </div>
      </div>
      <span class="chev">›</span>
    </div>
  `).join('') : `
    <div class="empty"><p>${
      query ? "Nothing on the shelf matches that." :
      filter === 'wishlist' ? "No games on the wishlist yet. Add one before you head to the store." :
      filter === 'owned' ? "Shelf's empty. Add the first disc you can put your hands on." :
      "Nothing here yet. Start with a disc you own or one you're after."
    }</p></div>
  `;
 
  app.innerHTML = `
    <header class="masthead">
      <h1>Disks</h1>
      <p>Your PlayStation discs, and what you're still hunting for. Pull this up before you buy something twice.</p>
      <div class="counts"><span><b>${ownedCount}</b> owned</span><span><b>${wishCount}</b> wishlist</span></div>
    </header>
 
    <div class="toolbar">
      <input class="search" placeholder="Search your shelf…" value="${escapeAttr(query)}">
    </div>
 
    <div class="tabs">
      <div class="tab ${filter==='all'?'active':''}" data-action="set-filter" data-filter="all">All</div>
      <div class="tab ${filter==='owned'?'active':''}" data-action="set-filter" data-filter="owned">Owned</div>
      <div class="tab ${filter==='wishlist'?'active':''}" data-action="set-filter" data-filter="wishlist">Wishlist</div>
    </div>
 
    <div class="list">${rowsHtml}</div>
 
    <button class="fab" data-action="open-sheet">Add a game</button>
  `;
 
  if (sheetOpenFlag) renderSheet();
 
  if (activeSearch) {
    const input = app.querySelector('.search');
    if (input) {
      input.focus();
      input.setSelectionRange(caret, caret);
    }
  }
}
 
function renderSheet() {
  const existing = editingId ? games.find(g => g.id === editingId) : null;
 
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.dataset.action = 'close-overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <h2>${existing ? 'Edit entry' : 'Add a game'}</h2>
      <form id="game-form">
        <div class="field">
          <label>Title</label>
          <input name="title" type="text" placeholder="e.g. Bloodborne" value="${existing ? escapeAttr(existing.title) : ''}" required>
        </div>
        <div class="field">
          <label>Platform</label>
          <select name="platform">
            ${PLATFORMS.map(p => `<option value="${p}" ${existing && existing.platform===p ? 'selected' : ''}>${p}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <div class="segmented">
            <button type="button" class="sel-owned ${formStatus==='owned'?'active':''}" data-action="set-status" data-status="owned">On my shelf</button>
            <button type="button" class="sel-wishlist ${formStatus==='wishlist'?'active':''}" data-action="set-status" data-status="wishlist">Wishlist</button>
          </div>
        </div>
        <div class="field">
          <label>Notes (edition, condition, anything worth remembering)</label>
          <textarea name="notes" placeholder="e.g. Collector's edition, case is a bit worn">${existing ? escapeHtml(existing.notes||'') : ''}</textarea>
        </div>
        <div class="sheet-actions">
          <button type="button" class="btn-secondary" data-action="close-sheet">Cancel</button>
          <button type="submit" class="btn-primary">${existing ? 'Save changes' : 'Add to shelf'}</button>
        </div>
        ${existing ? `<button type="button" class="btn-delete" data-action="delete-game" data-id="${existing.id}">Remove from list</button>` : ''}
      </form>
    </div>
  `;
  document.body.appendChild(overlay);
}
 
function cleanupSheet() {
  document.querySelectorAll('.sheet-overlay').forEach(el => el.remove());
}
 
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str) { return escapeHtml(str); }
 
// Centralized event delegation — avoids inline on* attributes, which the
// sandboxed preview can block.
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  if (action === 'open-sheet') openSheet(el.dataset.id);
  else if (action === 'close-sheet') closeSheet();
  else if (action === 'close-overlay') { if (e.target === el) closeSheet(); }
  else if (action === 'set-filter') { filter = el.dataset.filter; render(); }
  else if (action === 'set-status') {
    formStatus = el.dataset.status;
    el.parentElement.querySelector('.sel-owned').classList.toggle('active', formStatus === 'owned');
    el.parentElement.querySelector('.sel-wishlist').classList.toggle('active', formStatus === 'wishlist');
  }
  else if (action === 'delete-game') deleteGame(el.dataset.id);
});
 
document.addEventListener('input', (e) => {
  if (e.target.classList.contains('search')) {
    query = e.target.value;
    render();
  }
});
 
document.addEventListener('submit', (e) => {
  if (e.target.id === 'game-form') {
    e.preventDefault();
    submitForm(e.target);
  }
});
 
loadGames();
</script>
</body>
</html>
